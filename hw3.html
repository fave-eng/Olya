<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HW 3 — Vocabulary: Holidays · Olya's English Space</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --rose: #f43f5e; --orange: #fb923c; --amber: #f59e0b;
      --emerald: #10b981; --indigo: #4f46e5; --violet: #8b5cf6;
      --bg: #f1f5f9; --card: #ffffff;
      --text: #0f172a; --muted: #64748b; --border: #e2e8f0;
    }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); padding-bottom:120px; }

    .hero { background:linear-gradient(135deg,#f43f5e 0%,#fb923c 50%,#f59e0b 100%); padding:36px 24px 48px; position:relative; }
    .hero-wave { display:block; width:100%; line-height:0; background:var(--bg); }
    .hero-wave svg { display:block; width:100%; }
    .hero-back { display:inline-flex; align-items:center; gap:6px; color:rgba(255,255,255,.8); font-size:13px; font-weight:600; text-decoration:none; margin-bottom:18px; transition:color .2s; position:relative; z-index:1; }
    .hero-back:hover { color:#fff; }
    .hero-eyebrow { display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.3); color:#fff; font-size:12px; font-weight:600; padding:5px 14px; border-radius:100px; margin-bottom:12px; position:relative; z-index:1; }
    .hero h1 { font-family:'Plus Jakarta Sans',sans-serif; font-size:clamp(22px,5vw,34px); font-weight:800; color:#fff; letter-spacing:-.5px; margin-bottom:6px; position:relative; z-index:1; }
    .hero p { color:rgba(255,255,255,.8); font-size:14px; position:relative; z-index:1; }

    .page { max-width:700px; margin:0 auto; padding:0 20px; }

    .status-msg { display:none; border-radius:14px; padding:14px 18px; margin:20px 0 4px; font-size:14px; font-weight:600; }
    .status-msg.ok  { background:#d1fae5; border:1.5px solid #6ee7b7; color:#064e3b; display:block; }

    .section-lbl { font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin:28px 0 12px; }

    .progress-wrap { background:var(--card); border-radius:14px; border:1.5px solid var(--border); padding:16px 20px; margin-bottom:4px; }
    .progress-row { display:flex; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:8px; }
    .progress-bg { background:var(--border); border-radius:100px; height:7px; overflow:hidden; }
    .progress-fill { height:100%; background:linear-gradient(90deg,#f43f5e,#fb923c); border-radius:100px; transition:width .6s; }

    .ex-card { background:var(--card); border-radius:18px; border:1.5px solid var(--border); margin-bottom:16px; overflow:hidden; }
    .ex-head { display:flex; align-items:center; gap:12px; padding:16px 20px 0; }
    .ex-num  { width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,#f43f5e,#fb923c); color:#fff; font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .ex-head h2 { font-family:'Plus Jakarta Sans',sans-serif; font-size:15px; font-weight:700; }
    .ex-body { padding:12px 20px 20px; }
    .ex-sub { font-size:12.5px; color:var(--muted); font-style:italic; margin-bottom:14px; }

    .q-row { margin-bottom:14px; font-size:14.5px; line-height:1.8; }
    .q-example { font-size:13px; color:var(--muted); margin-bottom:10px; padding:8px 12px; background:#f8fafc; border-radius:8px; border:1px dashed var(--border); }
    .q-num { font-weight:700; color:var(--rose); margin-right:4px; }

    input[type="text"] { padding:7px 12px; font-size:14px; font-family:inherit; border:1.5px solid var(--border); border-radius:9px; background:#fafbff; color:var(--text); transition:border-color .2s; vertical-align:middle; width:170px; }
    input[type="text"].wide { width:100%; max-width:340px; }
    input[type="text"]:focus { outline:none; border-color:var(--indigo); background:#fff; }
    input[type="text"].correct { border-color:var(--emerald)!important; background:#f0fdf4; }
